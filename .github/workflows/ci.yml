name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install browser for accessibility checks
        run: npx playwright install --with-deps chromium

      - name: Browser journeys (accessibility + scroll reveal)
        run: npm run test:e2e

      - name: Build
        run: npm run build

      # Frontend plan FE-10. LCP and marketing-route JS are warnings until the
      # Sentry/Supabase bundle work lands; layout shift, page weight and the
      # overall score fail the build so things can't quietly get worse.
      - name: Performance budgets (Lighthouse CI)
        run: npm run lhci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
