name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install browser for accessibility checks
        run: npx playwright install --with-deps chromium

      - name: Browser journeys (accessibility + scroll reveal)
        run: npm run test:e2e

      - name: Build
        run: npm run build
